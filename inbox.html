<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConsult | Office Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <h2>EduConsult Portal</h2>
            <p>Office Management & Student Tracking System</p>
        </div>

        <form id="loginForm" onsubmit="handleEmailLogin(event)">
            <div class="input-group">
                <label for="role">Select Portal Access</label>
                <select id="role" required>
                    <option value="admin">System Admin</option>
                    <option value="staff">Consultancy Staff / Member</option>
                    <option value="agent">Sub-Agent</option>
                    <option value="student" selected>Student / Applicant</option>
                </select>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="user@educonsult.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary">Sign In to Dashboard</button>
        </form>

        <div class="divider"><span>OR CONTINUED WITH</span></div>

        <div class="auth-options">
            <button class="btn btn-oauth" onclick="handleGoogleLogin()">
                <i class="fa-brands fa-google"></i> Google
            </button>
            <button class="btn btn-oauth" onclick="togglePhoneAuth()">
                <i class="fa-solid fa-phone"></i> Phone OTP
            </button>
        </div>

        <!-- Phone Auth Modal Section -->
        <div id="phoneAuthSection" class="phone-section hidden">
            <div class="input-group">
                <input type="tel" id="phoneNumber" placeholder="+977 98XXXXXXXX">
                <button class="btn btn-secondary" onclick="sendOTP()">Send OTP</button>
            </div>
            <div id="otpGroup" class="input-group hidden">
                <input type="text" id="otpCode" placeholder="Enter 6-digit OTP">
                <button class="btn btn-success" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
